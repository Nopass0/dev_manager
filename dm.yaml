# Dev Manager — self-hosting config (dm builds dm via dm + Lua)
version: 1
project_name: dev_manager

services:
  dm:
    path: .
    language: rust
    run: "cargo run -- --help"
    watch: false
    restart_on_change: false

build:
  output_dir: dist
  clean: true
  stages:
    - name: "1. Test suite"
      source: .
      command: "cargo test --workspace 2>&1"
      artifacts: []

    - name: "2. Clippy check"
      source: .
      command: "cargo clippy --workspace --all-targets -- -D warnings 2>&1"
      artifacts: []
      depends_on: ["1. Test suite"]

    - name: "3. Build release"
      source: .
      command: "cargo build --release --workspace 2>&1"
      artifacts:
        - "target/release/dm.exe"
      dest_subdir: ""
      depends_on: ["2. Clippy check"]
      on_success: scripts/package.lua

aliases:
  t: "dm lua scripts/check.lua"
  build: "dm build"
  test: "cargo test --workspace"
  lint: "cargo clippy --workspace -- -D warnings"
