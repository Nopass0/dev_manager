name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install C compiler + X11 + dbus libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxtst-dev libxkbcommon-dev libxdo-dev libdbus-1-dev libwayland-dev

      - name: Set MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Проект кросс-платформенный: cfg-блоки для Windows/Unix закономерно дают
        # платформо-зависимые предупреждения, которые нельзя проверить на одном
        # runner'е. Поэтому -D warnings + allow атрибуты в коде для платформенных
        # модулей; реальный clippy-pass на каждой ОС отдельно.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  build-release:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            archive: dm-x86_64-unknown-linux-musl.tar.gz
          - os: windows-latest
            archive: dm-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxtst-dev libxkbcommon-dev libxdo-dev libdbus-1-dev libwayland-dev
      - name: Build release
        run: cargo build --release --workspace
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf dist && mkdir -p dist
          cp target/release/dm dist/
          tar -czf ${{ matrix.archive }} -C dist dm
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist | Out-Null
          copy target\release\dm.exe dist\
          Compress-Archive -Path dist\dm.exe -DestinationPath ${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
