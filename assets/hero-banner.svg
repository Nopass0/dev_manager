<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="Dev Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="320" rx="20" fill="url(#bg)"/>

  <!-- декоративная сетка -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="880" y2="80"/>
    <line x1="0" y1="160" x2="880" y2="160"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="220" y1="0" x2="220" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
    <line x1="660" y1="0" x2="660" y2="320"/>
  </g>

  <!-- логотип: стилизованный терминал -->
  <g transform="translate(70,90)" filter="url(#glow)">
    <rect x="0" y="0" width="140" height="140" rx="22" fill="#020617" stroke="url(#logo)" stroke-width="3"/>
    <circle cx="22" cy="24" r="6" fill="#ef4444"/>
    <circle cx="44" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="24" r="6" fill="#22c55e"/>
    <!-- промпт dm -->
    <text x="20" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="34" font-weight="700" fill="#f8fafc">dm</text>
    <rect x="78" y="70" width="42" height="30" rx="5" fill="url(#logo)"/>
    <text x="99" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">_</text>
  </g>

  <!-- название -->
  <text x="250" y="135" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="58" font-weight="800" fill="#f8fafc" letter-spacing="-1">Dev Manager</text>

  <!-- подзаголовок с акцентом -->
  <rect x="250" y="158" width="380" height="5" rx="2" fill="url(#accent)"/>
  <text x="250" y="195" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Единый менеджер разработки микросервисов</text>
  <text x="250" y="225" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#64748b">Оркестрация · Git · Анализ кода · Деплой</text>

  <!-- фичи-чипы -->
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="600">
    <rect x="250" y="252" width="118" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="309" y="274" fill="#22c55e" text-anchor="middle">🚀 Hot-reload</text>
    <rect x="378" y="252" width="96" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="426" y="274" fill="#38bdf8" text-anchor="middle">🌿 Multi-repo</text>
    <rect x="484" y="252" width="120" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="544" y="274" fill="#f472b6" text-anchor="middle">🔬 Tree-sitter</text>
    <rect x="614" y="252" width="128" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="678" y="274" fill="#f59e0b" text-anchor="middle">🪟🐧 Win + Linux</text>
  </g>
</svg>
